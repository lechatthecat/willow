[package]
name = "willowc"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/willow_runtime"]
resolver = "3"

[[bin]]
name = "willowc"
path = "src/main.rs"

[lib]
name = "willow_compiler"
path = "src/lib.rs"

[[bench]]
name = "compiler_bench"
harness = false

[dependencies]
cc = "1.4.1"
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-module = "0.134"
cranelift-object = "0.134"
cranelift-native = "0.134"
target-lexicon = "0.13"
anyhow = "1.0"
thiserror = "2"
object = "0.40"
toml = "1.1.4"
serde = { version = "1", features = ["derive"] }
