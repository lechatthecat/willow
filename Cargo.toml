[package]
name = "willow"
default-run = "willow"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
# Only explicitly registered benchmark sources are public.
autobenches = false
autobins = false

[workspace]
members = [".", "crates/willow_abi", "crates/willow_runtime", "crates/willow_continuations", "crates/willow_runtime_macros"]
default-members = [".", "crates/willow_abi", "crates/willow_runtime", "crates/willow_continuations"]
resolver = "3"

[[bin]]
name = "willow"
path = "src/willow.rs"

[lib]
name = "willow_compiler"
path = "src/lib.rs"

[features]
packaged = []

[[bench]]
name = "compiler_bench"
harness = false

[dependencies]
cc = "1.7.0"
cranelift-codegen = "0.136.2"
cranelift-frontend = "0.136.2"
cranelift-module = "0.136.2"
cranelift-object = "0.136.2"
cranelift-native = "0.136.2"
target-lexicon = "0.13.5"
anyhow = "1.0.104"
thiserror = "2.0.21"
semver = "1.0.28"
sha2 = "0.11.0"
object = "0.40.0"
toml = "1.1.8"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.152"
willow_abi = { path = "crates/willow_abi" }
willow_continuations = { path = "crates/willow_continuations" }
toml_edit = "0.25.17"

# The runtime's hot FFI entry points (willow_sync_poll_counter, safepoint and
# barrier fast paths) are called from every generated function. With the
# default 16 codegen units, thread_local! accessor shims can be partitioned
# away from their callers and stop being inlined (willow-vos2).
[profile.release.package.willow_runtime]
codegen-units = 1
