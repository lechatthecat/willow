[package]
name = "willow_runtime"
version = "0.1.8"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "willow_runtime"
crate-type = ["staticlib", "rlib"]

[features]
# Explicit acceptance executable only; production compiler builds never enable this.
gc-acceptance-faults = []
# Acceptance-test runtime only; never enabled by the compiler's normal build.
borrow-migration-probe = []
# M3 comparison only; normal compiler/runtime builds retain the existing waiter.
gc-notification-prototype = []

[[example]]
name = "gc_acceptance"
# Spool consumer gating and fault injection exist only with this feature.
required-features = ["gc-acceptance-faults"]

[dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher", "inline-more"] }
crossbeam-deque = "0.8.8"
libc = "0.2.190"
ryu = "1.0.23"
socket2 = "0.6.5"
willow_abi = { path = "../willow_abi" }
willow_runtime_macros = { path = "../willow_runtime_macros" }

[target.'cfg(any(all(target_os = "linux", target_env = "gnu", any(target_arch = "x86_64", target_arch = "aarch64")), all(target_os = "macos", any(target_arch = "x86_64", target_arch = "aarch64")), all(target_os = "windows", target_arch = "x86_64", target_env = "msvc")))'.dependencies]
corosensei = "0.3.4"
