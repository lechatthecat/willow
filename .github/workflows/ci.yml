name: CI

on:
  # Branch pushes only: a tag on an already-tested commit would rerun the
  # full suite.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Ubuntu runners spend ~53 min in the integration binary alone; the
    # remaining workspace tests, stress steps and example audit exceed 90.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # TEMPORARY: macOS Intel failure triage only.
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Select native toolchain
        run: rustup override set 1.96.0-${{ matrix.target }}
      # TEMPORARY: rerun only the tests that failed or hung on macOS Intel.
      - name: Bounded sweep tests (repeated)
        timeout-minutes: 60
        shell: bash
        run: |
          for i in $(seq 1 20); do
            echo "::group::iteration $i"
            cargo test --locked -p willow_runtime --lib gc::sweep::batches -- --nocapture
            echo "::endgroup::"
          done
      - name: Previously flaky integration tests
        run: cargo test --locked --test integration -- module_call_frames::panic_frames_async_method_locations_debug_and_release runtime::async_scalar_references::async_mut_sync_preemption_example_modes --exact
