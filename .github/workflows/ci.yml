name: CI

on:
  # Branch pushes only: a tag on an already-tested commit would rerun the
  # full suite.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Ubuntu runners spend ~73 min in the integration binary alone, and macOS
    # and Windows runners vary by about 1.7x between runs. A full job can pass
    # 180 min on a slow runner, so this limit only guards against hangs.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show active-toolchain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned verification solver
        run: |
          python -m pip install z3-solver==4.15.4.0
          python -c "import os,pathlib,sys; p=pathlib.Path(sys.prefix)/'bin'/('z3.exe' if os.name=='nt' else 'z3'); assert p.is_file(), p; open(os.environ['GITHUB_ENV'],'a').write('WILLOW_Z3='+str(p)+'\n')"
      - name: GC stop trace parser
        if: always()
        run: python scripts/gc_stop_trace_check.py --self-test
      - name: GC stop trace completeness
        if: always()
        run: python scripts/gc_stop_telemetry_repro.py --output "${{ runner.temp }}/willow-gc-stops"
      - name: Normal old GC phase-stop trace
        if: always()
        run: python scripts/gc_stop_telemetry_repro.py --major-only --output "${{ runner.temp }}/willow-gc-stops/major-only"
      - name: Willow lib tests
        if: always()
        run: cargo test --locked -p willow --lib
      - name: Integration tests
        if: always()
        run: cargo test --locked --test integration --no-fail-fast -- --skip runtime::examples::test_runnable_example_files_compile_and_run
      - name: Runnable example audit
        if: always()
        run: cargo test --locked --test integration runtime::examples::test_runnable_example_files_compile_and_run -- --exact --nocapture
