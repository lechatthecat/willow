name: Panic/recover portability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/panic-recover-portability.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/willow_runtime/**"
      - "example/panic_recover_service.wi"
      - "src/**"
      - "tests/integration.rs"
      - "tests/integration/panic_recover*.rs"
      - "tests/integration/support.rs"
  push:
    paths:
      - ".github/workflows/panic-recover-portability.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/willow_runtime/**"
      - "example/panic_recover_service.wi"
      - "src/**"
      - "tests/integration.rs"
      - "tests/integration/panic_recover*.rs"
      - "tests/integration/support.rs"

permissions:
  contents: read

concurrency:
  group: panic-recover-portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 Intel
            os: macos-15-intel
          - name: Windows Server 2022
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Select the current stable Rust toolchain
        run: rustup update stable
      - name: Run the portable panic/recover stress suite
        run: "cargo test --locked --test integration panic_recover_stress:: -- --nocapture"
