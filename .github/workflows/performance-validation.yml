name: Performance validation

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Native runner labels as a JSON array
        required: false
        default: '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "macos-15-intel", "windows-2025"]'
  push:
    branches: [codex/bd-performance-batch]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/performance-validation.yml'

permissions:
  contents: read

jobs:
  native:
    name: Performance / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.targets || '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "macos-15-intel", "windows-2025"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1e5f30c5e03e6756793c14bd901f13e5dbbb142d
          path: baseline
      - name: Install toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component llvm-tools
      - name: Build compiler and runtime pair
        shell: bash
        run: |
          cargo +1.95.0 build --locked --bin willowc
          cargo +1.95.0 build --locked --release -p willow_runtime
          cargo +1.95.0 build --locked --release --manifest-path baseline/Cargo.toml -p willow_runtime --target-dir baseline/target
      - name: Native correctness gates
        shell: bash
        run: |
          cargo +1.95.0 test --locked -p willow_runtime
          cargo +1.95.0 test --locked --lib toolchain::
          cargo +1.95.0 test --locked --test integration toolchain::
          cargo +1.95.0 test --locked --test integration panic_recover_stress::
      - name: Timing and accessor disassembly
        shell: bash
        run: |
          mkdir -p evidence
          archive=libwillow_runtime.a
          if [ "$RUNNER_OS" = Windows ]; then archive=willow_runtime.lib; fi
          python3 scripts/benchmark_runtime_depth.py --before "baseline/target/release/$archive" --after "target/release/$archive" --iterations 9 --output evidence/runtime_depth.json
          python3 scripts/native_runtime_disassembly.py baseline/target/release/$archive target/release/$archive evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.os }}
          path: evidence/
